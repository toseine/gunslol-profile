<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b10">
  <meta name="description" content="Moja przestrzeń w sieci">
  <title>Profil</title>
  <link rel="stylesheet" href="./src/css/style.css">
  <script type="module" src="./src/js/app.js"></script>
</head>
<body>
  <div class="background" aria-hidden="true">
    <video id="background-video" autoplay muted loop playsinline></video>
    <div class="background-shade"></div>
  </div>
  <canvas id="snow-canvas" aria-hidden="true"></canvas>
  <div id="cursor" class="cursor" aria-hidden="true"></div>

  <main class="page-shell">
    <section class="profile-card" aria-label="Wizytówka">
      <div class="card-glow" aria-hidden="true"></div>
      <p class="eyebrow"><span class="online-dot"></span> ONLINE SPACE <span class="eyebrow-line"></span> 001</p>
      <div class="avatar" aria-hidden="true"><span id="avatar-letter">N</span></div>
      <h1 id="profile-name">Twój nick</h1>
      <p id="profile-bio" class="bio">Twoja przestrzeń w sieci.</p>
      <div class="divider"><span></span><i>CONNECT</i><span></span></div>
      <nav class="socials" aria-label="Media społecznościowe">
        <a id="discord-link" class="social" target="_blank" rel="noopener noreferrer" hidden>
          <span class="social-icon" aria-hidden="true">✦</span><span>Discord</span><span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a id="github-link" class="social" target="_blank" rel="noopener noreferrer" hidden>
          <span class="social-icon" aria-hidden="true">⌘</span><span>GitHub</span><span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a id="youtube-link" class="social" target="_blank" rel="noopener noreferrer" hidden>
          <span class="social-icon" aria-hidden="true">▶</span><span>YouTube</span><span class="arrow" aria-hidden="true">↗</span>
        </a>
      </nav>
      <p id="status" class="status" role="status">Ładowanie profilu…</p>
    </section>
    <button id="music-toggle" class="music-toggle" type="button" aria-pressed="false" hidden>
      <span class="music-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span id="music-label">Włącz muzykę</span>
    </button>
    <audio id="music" loop preload="none"></audio>
  </main>
</body>
</html>
