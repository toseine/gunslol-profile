<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <meta name="description" content="Moja przestrzeń w sieci">
  <title>Profil</title>
  <link rel="stylesheet" href="./src/css/style.css">
  <script type="module" src="./src/js/app.js"></script>
</head>
<body class="home-theme">
  <div class="background" aria-hidden="true"><video id="background-video" autoplay muted loop playsinline></video><div class="background-shade"></div></div>
  <div class="glitch-overlay" aria-hidden="true"></div>
  <canvas id="snow-canvas" aria-hidden="true"></canvas>
  <div id="cursor" class="custom-cursor" aria-hidden="true"></div>
  <main class="page-shell">
    <section id="profile-block" class="profile-block" aria-label="Wizytówka">
      <div class="profile-header">
        <div class="profile-container"><img id="profile-picture" class="profile-picture" alt="" hidden><span id="avatar-letter" class="avatar-letter">N</span></div>
        <div class="profile-info"><div class="name-and-badges"><h1 id="profile-name">Twój nick</h1><span class="owner-badge" title="Profil właściciela">✦</span></div><p id="profile-bio">Twoja przestrzeń w sieci.</p></div>
      </div>
      <div class="bio-separator" aria-hidden="true"></div>
      <div class="profile-footer">
        <nav class="social-links" aria-label="Media społecznościowe">
          <a id="discord-link" class="social-icon" target="_blank" rel="noopener noreferrer" aria-label="Discord" hidden>✦</a>
          <a id="github-link" class="social-icon" target="_blank" rel="noopener noreferrer" aria-label="GitHub" hidden>⌘</a>
          <a id="youtube-link" class="social-icon" target="_blank" rel="noopener noreferrer" aria-label="YouTube" hidden>▶</a>
          <a id="tiktok-link" class="social-icon" target="_blank" rel="noopener noreferrer" aria-label="TikTok" hidden>♪</a>
        </nav>
        <span class="profile-mark">PROFILE / 001</span>
      </div>
      <p id="status" class="status" role="status">Ładowanie profilu…</p>
    </section>
    <div class="controls" role="group" aria-label="Motyw profilu">
      <button class="theme-button" type="button" data-theme="home" aria-label="Motyw podstawowy" title="Podstawowy">1</button>
      <button class="theme-button" type="button" data-theme="hacker" aria-label="Motyw hacker" title="Hacker">2</button>
      <button class="theme-button" type="button" data-theme="rain" aria-label="Motyw deszcz" title="Deszcz">3</button>
      <button class="theme-button" type="button" data-theme="anime" aria-label="Motyw anime" title="Anime">4</button>
      <button class="theme-button" type="button" data-theme="car" aria-label="Motyw samochód" title="Samochód">5</button>
    </div>
    <div class="top-controls">
      <button id="music-toggle" class="music-toggle" type="button" aria-pressed="false" hidden><span aria-hidden="true">♫</span><span id="music-label">Włącz muzykę</span></button>
      <label class="slider-control" for="volume-slider"><span>VOL</span><input id="volume-slider" type="range" min="0" max="1" step="0.01" value="0.3" aria-label="Głośność muzyki"></label>
      <label class="slider-control" for="transparency-slider"><span>GLASS</span><input id="transparency-slider" type="range" min="0.25" max="0.95" step="0.01" value="0.68" aria-label="Przezroczystość karty"></label>
    </div>
    <audio id="music" loop preload="none"></audio>
  </main>
</body>
</html>
