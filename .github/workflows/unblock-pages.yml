name: Unblock stuck Pages deployment
on:
  workflow_dispatch:
jobs:
  cancel-stuck-deployment:
    runs-on: ubuntu-latest
    permissions:
      pages: write
    steps:
      - name: Cancel stuck Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/deployments/cc5548df91d04b576541ceb24b408a371160af5d/cancel"
